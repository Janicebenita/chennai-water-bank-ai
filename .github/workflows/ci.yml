name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATA_BACKEND: memory
      MOSS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile Python
        run: python -m compileall -q app.py pages src tests scripts
      - name: Ruff
        run: python -m ruff check .
      - name: Tests and coverage gate
        run: python -m pytest
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: warn
